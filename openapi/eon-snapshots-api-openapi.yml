        providerDiskId:
          description: Cloud-provider-assigned ID of the disk to restore.
          example: '5178361631409150158'
          type: string
        restoreAccountId:
          description: Eon-assigned ID of the restore account.
          example: 1ee34dc5-0a7c-4e56-a820-917371e05c8d
