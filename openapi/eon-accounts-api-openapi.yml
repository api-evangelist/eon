components:
  schemas:
    AzureSourceAccountAttributes:
      description: 'Azure subscription configuration.

        Applicable if `cloudProvider` is set to `AZURE`.

        '
      example:
        managementGroupId: 3eca9074-011f-5008-9605-a7ccf00aa93e
        tenantId: 060901b5-ae27-5b6f-aaf5-829b635615e9
        eonInternalResourceGroupName: eon-source-internal-rg
        subscriptionId: 12345678-1234-1234-1234-123456789012
      nullable: true
      properties:
        tenantId:
          description: ID of the Azure tenant the subscription belongs to.
          example: 060901b5-ae27-5b6f-aaf5-829b635615e9
          format: uuid
          type: string
        subscriptionId:
          description: ID of the Azure subscription.
          example: 12345678-1234-1234-1234-123456789012
          format: uuid
          type: string
        eonInternalResourceGroupName:
          default: eon-source-internal-rg
          description: 'Resource group name for Eon''s temporary internal resources.

            '
          example: eon-source-internal-rg
          type: string
        managementGroupId:
          description: ID of the Azure management group the source account is scoped to.
          example: 3eca9074-011f-5008-9605-a7ccf00aa93e
          type: string
      required:
      - subscriptionId
      - tenantId
      type: object
    UpdateGcpRestoreAccountAttributes:
      description: 'Updatable GCP account fields.

        '
      example:
        serviceAccount: eon-restore@my-project.iam.gserviceaccount.com
      nullable: true
      properties:
        serviceAccount:
          description: 'Email of the service account Eon impersonates to access the GCP project.

            Only the service account name portion can be changed.

            The GCP project ID must remain the same.

            '
          example: eon-restore@my-project.iam.gserviceaccount.com
          type: string
          x-nullable: true
      type: object
      x-nullable: true
    DisconnectSourceAwsOrganizationalUnitResponse:
      example:
        organizationalUnit:
          providerOrganizationalUnitId: ou-a1b2-f6g7h111
          roleArn: arn:aws:iam::123412341234:role/EonSourceAccountRole
          name: prod-eu organizational unit
          id: fc495499-9796-5fc9-ade7-1ba924cbcc42
          providerManagementAccountId: '123456789012'
          status: CONNECTED
      properties:
        organizationalUnit:
          $ref: '#/components/schemas/SourceAwsOrganizationalUnit'
      required:
      - organizationalUnit
      type: object
    AccountInstallationMethod:
      default: UNSPECIFIED
      description: 'Method used to deploy the cloud permissions.

        `UNSPECIFIED` is supported only in responses.

        '
      enum:
      - UNSPECIFIED
      - CLOUDFORMATION
      - TERRAFORM
      - BASH_SCRIPT
      example: TERRAFORM
      type: string
      x-enum-varnames:
      - ACCOUNT_INSTALLATION_METHOD_UNSPECIFIED
      - ACCOUNT_INSTALLATION_METHOD_CLOUDFORMATION
      - ACCOUNT_INSTALLATION_METHOD_TERRAFORM
      - ACCOUNT_INSTALLATION_METHOD_BASH_SCRIPT
    SourceAccountSortField:
      description: Field to sort by.
      enum:
      - accountName
      - installedVersion
      - parentIdentifier
      - createdAt
      example: accountName
      type: string
      x-enum-varnames:
      - SOURCE_ACCOUNT_SORT_ACCOUNT_NAME
      - SOURCE_ACCOUNT_SORT_INSTALLED_VERSION
      - SOURCE_ACCOUNT_SORT_PARENT_IDENTIFIER
      - SOURCE_ACCOUNT_SORT_FIRST_CONNECTED
    AccountNameFilters:
      additionalProperties: false
      example:
        contains:
        - contains
        - contains
        in:
        - in
        - in
        notContains:
        - notContains
        - notContains
        notIn:
        - notIn
        - notIn
      properties:
        in:
          description: Matches if any string in this list equals `accountName`.
          items:
            type: string
          type: array
        notIn:
          description: Matches if no string in this list equals `accountName`.
          items:
            type: string
          type: array
        contains:
          description: Matches if any string in this list is a substring of `accountName`.
          items:
            type: string
          type: array
        notContains:
          description: Matches if no string in this list is a substring of `accountName`.
          items:
            type: string
          type: array
      type: object
    GetSourceAccountResponse:
      example:
        sourceAccount:
          providerAccountId: '123412341234'
          name: prod-eu
          connectedTime: 2024-08-29 13:24:03+00:00
          id: fc495499-9796-5fc9-ade7-1ba924cbcc42
          sourceAccountAttributes:
            gcp:
              organizationId: '123456789012'
              serviceAccount: serviceAccount
              folderId: '987654321098'
            cloudProvider: AWS
            aws:
              organizationId: o-1234567890
              roleArn: arn:aws:iam::123412341234:role/EonSourceAccountRole
            azure:
              managementGroupId: 3eca9074-011f-5008-9605-a7ccf00aa93e
              tenantId: 060901b5-ae27-5b6f-aaf5-829b635615e9
              eonInternalResourceGroupName: eon-source-internal-rg
              subscriptionId: 12345678-1234-1234-1234-123456789012
          providerAccountName: providerAccountName
          version:
            installed: 1.0.0
            installationMethod: TERRAFORM
            latest: 1.2.0
