        `UNSPECIFIED` is supported only in responses.

        '
      enum:
      - CREDITS
      - USD
      - UNSPECIFIED
      example: CREDITS
      type: string
      x-enum-varnames:
      - COST_UNIT_CREDITS
      - COST_UNIT_USD
      - COST_UNIT_UNSPECIFIED
    Cost:
      example:
        amount: 150.75
        unit: CREDITS
      properties:
        amount:
          description: 'Cost amount in the specified currency unit.

            1 credit is equivalent to 0.01 USD.

            '
          example: 150.75
          format: double
          minimum: 0
          type: number
        unit:
          $ref: '#/components/schemas/CostUnit'
      required:
      - amount
      - unit
      type: object
    QueryCostDataRequest:
      example:
        usageUnit: BYTES
        costUnit: CREDITS
        granularity: MONTHLY
        filters:
          resourceId:
