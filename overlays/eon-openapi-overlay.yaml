overlay: 1.0.0
info:
  title: API Evangelist enhancements for Eon API
  version: 1.0.0
extends: openapi/eon-openapi-original.yml
actions:
- target: $.info
  update:
    x-apievangelist-provider: eon
    x-apievangelist-category: cloud-backup
    x-apievangelist-review-date: '2026-07-19'
    x-api-host: https://console.eon.io
    x-credentials-url: https://console.eon.io/global-management/api-credentials
- target: $.servers
  update:
  - url: https://console.eon.io
    description: Eon production API host (spec ships a relative server; captured from the
      credentials/console host).
- target: $.info
  update:
    x-conventions: conventions/eon-conventions.yml
    x-error-catalog: errors/eon-problem-types.yml
    x-data-model: data-model/eon-data-model.yml
