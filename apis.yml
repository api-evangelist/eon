aid: eon
name: Eon
description: >-
  Eon is a next-generation cloud backup and data-protection platform that turns cloud backups into
  live, searchable, strategic assets across AWS, Google Cloud, and Azure. It provides agentless
  backup, cloud backup posture management, ransomware protection, global search over backups, live and
  granular file/resource restore, and a zero-ETL data-lake storage tier that makes old snapshots useful
  for analytics and AI. Eon exposes a REST API (OpenAPI 3.0, 99 operations) covering source/restore
  accounts, resources, vaults, snapshots, backup policies, restores, jobs, IAM, billing, and
  multi-party action approvals, with an official Go SDK and Terraform provider. Backed by BOND Capital
  and Lightspeed Venture Partners.
